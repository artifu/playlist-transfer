name: Production critical path monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-critical-path-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check production critical paths
        id: monitor
        continue-on-error: true
        env:
          MONITOR_RESULT_PATH: ${{ runner.temp }}/playlistxfer-monitor-result.json
        run: node tools/production-critical-path-monitor.mjs

      - name: Open or resolve the production incident
        uses: actions/github-script@v7
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          MONITOR_RESULT_PATH: ${{ runner.temp }}/playlistxfer-monitor-result.json
        with:
          script: |
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.MONITOR_RESULT_PATH, "utf8"));
            const title = "[production] PlaylistXfer critical path alert";
            const label = "production-monitor";
            const failed = result.checks.filter((check) => !check.ok);
            const lines = result.checks.map((check) =>
              `- ${check.ok ? "✅" : "❌"} **${check.name}**: ${check.category}` +
              `${check.status ? ` (HTTP ${check.status})` : ""} — ${check.detail}`
            );
            const body = [
              "Automated production monitoring detected a degraded or unavailable critical path.",
              "",
              `Last checked: ${result.checkedAt}`,
              "",
              ...lines,
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "This issue is maintained automatically and will close after recovery."
            ].join("\n");

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "B60205",
                description: "Automated PlaylistXfer production incident"
              });
            }

            const openIssues = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: label,
              per_page: 10
            });
            const incident = openIssues.data.find((issue) => issue.title === title);

            if (process.env.MONITOR_OUTCOME === "failure" || failed.length > 0) {
              if (incident) {
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: incident.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  ...context.repo,
                  title,
                  body,
                  labels: [label],
                  assignees: [context.repo.owner]
                });
              }
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: incident.number,
                body: `✅ All monitored critical paths recovered at ${result.checkedAt}.`
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: incident.number,
                state: "closed",
                state_reason: "completed"
              });
            }
